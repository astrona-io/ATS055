apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command: ["sleep", "86400"]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: probe-ingress
  namespace: starfleet
spec:
  endpointSelector:
    matchLabels:
      app: probe
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: shuttle
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: rogue
  namespace: outpost
  labels:
    app: rogue
spec:
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command:
    - sh
    - -c
    - while true; do curl -s -m 3 -o /dev/null http://probe.starfleet:8080/get; sleep 5; done
---
apiVersion: v1
kind: Pod
metadata:
  name: cadet
  namespace: starfleet
  labels:
    app: cadet
spec:
  containers:
  - name: client
    image: curlimages/curl:8.22.0
    command: ["sleep", "86400"]
