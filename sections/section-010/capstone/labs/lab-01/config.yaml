# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Observe Dropped Traffic End To End (LAB). UNTESTED: not run yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-055-lab-010-cap
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-environment
    description: Install Cilium with Hubble and create the example workloads
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: settings-applied
    description: "Drop and flow metrics on :9965 and a buffer of 16383 are active in the agent"
    type: file
    source: validation/validate-settings-applied.sh
    hint: "Set hubble-metrics, hubble-metrics-server and hubble-event-buffer-capacity, then restart the DaemonSet."
  - name: drop-report-correct
    description: "drop-report names the right source, destination and port"
    type: file
    source: validation/validate-drop-report-correct.sh
    hint: "Use namespace/pod."
  - name: drop-report-reason
    description: "drop-report gives the policy-denied reason"
    type: file
    source: validation/validate-drop-report-reason.sh
    hint: "Use the reason that Hubble prints for the dropped flow."
  - name: drop-metric-exposed
    description: "The agent exposes hubble_drop_total"
    type: file
    source: validation/validate-drop-metric-exposed.sh
    hint: "The metric needs port 9965 and the drop metric."
teardown:
  keepCluster: false
