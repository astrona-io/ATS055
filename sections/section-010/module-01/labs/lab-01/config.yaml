# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Read Forwarded And Dropped Flows (LAB). UNTESTED: not run yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-055-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-environment
    description: Install Cilium with Hubble and create the example workloads
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: forwarded-flow-exists
    description: "Hubble holds a forwarded flow from shuttle to probe"
    type: file
    source: validation/validate-forwarded-flow-exists.sh
    hint: "Send a request from shuttle, then look for it with hubble observe."
  - name: dropped-flow-exists
    description: "Hubble holds a dropped flow from drifter to probe"
    type: file
    source: validation/validate-dropped-flow-exists.sh
    hint: "Send a request from drifter. It must be dropped by the policy."
  - name: report-correct
    description: "The report names the right sources and port"
    type: file
    source: validation/validate-report-correct.sh
    hint: "Use namespace/pod for the sources."
  - name: policy-unchanged
    description: "The probe-ingress policy still exists and still allows only shuttle"
    type: file
    source: validation/validate-policy-unchanged.sh
    hint: "Do not edit the policy."
teardown:
  keepCluster: false
