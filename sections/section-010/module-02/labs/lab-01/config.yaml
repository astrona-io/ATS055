# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Enable Hubble Drop Metrics And Resize The Flow Buffer (LAB). UNTESTED: not run yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-055-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-environment
    description: Install Cilium with Hubble and create the example workloads
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: config-keys-set
    description: "cilium-config enables drop and flow metrics on port 9965 and a buffer of 8191"
    type: file
    source: validation/validate-config-keys-set.sh
    hint: "Keys: hubble-metrics, hubble-metrics-server, hubble-event-buffer-capacity."
  - name: agent-running-new-buffer
    description: "The agent runs with a flow buffer of 8191 flows"
    type: file
    source: validation/validate-agent-running-new-buffer.sh
    hint: "Restart the DaemonSet after the change and wait for the rollout."
  - name: drop-metric-exposed
    description: "The agent exposes hubble_drop_total with the policy-denied reason"
    type: file
    source: validation/validate-drop-metric-exposed.sh
    hint: "Metrics need port 9965 and the drop metric. Dropped traffic comes from rogue."
teardown:
  keepCluster: false
