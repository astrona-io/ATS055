# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Count HTTP Requests With Hubble Metrics (LAB). UNTESTED: not run yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-055-lab-020-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-environment
    description: Install Cilium with Hubble and create the example workloads
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: metrics-keys-set
    description: "cilium-config enables httpV2 metrics on port 9965"
    type: file
    source: validation/validate-metrics-keys-set.sh
    hint: "Keys: hubble-metrics and hubble-metrics-server."
  - name: http-metric-exposed
    description: "The agent exposes hubble_http_requests_total after requests from shuttle"
    type: file
    source: validation/validate-http-metric-exposed.sh
    hint: "Restart the DaemonSet after the change. The metric appears after HTTP requests pass the proxy."
  - name: policy-unchanged
    description: "The probe policy keeps its GET /get rule and its single source"
    type: file
    source: validation/validate-policy-unchanged.sh
    hint: "Change only the ConfigMap."
teardown:
  keepCluster: false
