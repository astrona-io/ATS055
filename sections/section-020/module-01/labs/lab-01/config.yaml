# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Add HTTP Visibility With A Policy (LAB). UNTESTED: not run yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-055-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-environment
    description: Install Cilium with Hubble and create the example workloads
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: http-rule-present
    description: "The probe policy has an HTTP rule for GET /get from shuttle only"
    type: file
    source: validation/validate-http-rule-present.sh
    hint: "Add rules.http with method GET and path /get under toPorts."
  - name: http-behaviour
    description: "GET /get from shuttle returns 200, GET /headers returns 403, drifter is refused"
    type: file
    source: validation/validate-http-behaviour.sh
    hint: "The rule must allow only GET /get. A request that breaks the rule gets 403 from the proxy."
  - name: http-flows-visible
    description: "Hubble shows the HTTP request GET /get as forwarded and /headers as dropped"
    type: file
    source: validation/validate-http-flows-visible.sh
    hint: "Send both requests from shuttle, then run hubble observe --type l7 --protocol http."
teardown:
  keepCluster: false
