# Final domain knowledge check across all three sections.
schema_version: 1
kind: question_bank
id: ats055-final
course_id: ATS055
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: network-observability
  title: Network Observability
questions:
- id: ats055-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name the Hubble components and where flows are stored
  source_readings:
  - sections/section-010/module-01/course-01-hubble-components-and-where-flows-come-from.md
  prompt: On a node, which component turns datapath events into flows and stores the
    most recent ones?
  options:
  - id: a
    text: Hubble Relay, in a database on the control plane.
    explanation: Relay joins the flows of many nodes and does not store them.
  - id: b
    text: The Hubble server inside the Cilium agent, in an in-memory ring buffer.
    explanation: Correct. The Hubble server in the agent builds flows from the kernel
      events and keeps them in a fixed-size ring buffer in memory.
  - id: c
    text: The Hubble UI, in a file on the node.
    explanation: The UI only draws flows that it reads from Relay.
  - id: d
    text: The Cilium operator, in a ConfigMap.
    explanation: The operator does not create or store flows.
  correct_option: b
  explanation: The Hubble server in the agent builds flows from the kernel events
    and keeps them in a fixed-size ring buffer in memory.
- id: ats055-final-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Read the source, destination and verdict of a flow
  source_readings:
  - sections/section-010/module-01/course-02-reading-a-flow-record-and-its-verdict.md
  prompt: A flow line ends with `to-stack FORWARDED`. What does `FORWARDED` tell you?
  options:
  - id: a
    text: The server returned a successful HTTP response.
    explanation: Layer 3 and 4 flows do not carry HTTP status codes.
  - id: b
    text: The client received the reply.
    explanation: A reply has its own flows.
  - id: c
    text: The datapath let the packet pass; it does not tell you whether the application
      answered.
    explanation: Correct. A verdict describes the datapath decision, not the application
      result.
  - id: d
    text: No policy applies to the traffic.
    explanation: Forwarded traffic can be allowed by a policy.
  correct_option: c
  explanation: A verdict describes the datapath decision, not the application result.
- id: ats055-final-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what an identity is
  source_readings:
  - sections/section-010/module-01/course-03-identities-and-endpoints-in-a-flow.md
  prompt: What is a Cilium identity?
  options:
  - id: a
    text: A number that Cilium gives to a set of labels, shared by all pods with the
      same labels.
    explanation: Correct. The datapath marks packets with this number and Hubble translates
      it to names and labels.
  - id: b
    text: The IP address of a pod.
    explanation: Addresses change; the identity is derived from labels.
  - id: c
    text: The name of the node that runs the pod.
    explanation: The node name is a separate field of a flow.
  - id: d
    text: A certificate that the pod presents to Relay.
    explanation: Certificates secure Hubble connections, not endpoint identity.
  correct_option: a
  explanation: An identity is a number for a set of labels. It lets a flow name the
    workload instead of only an address.
- id: ats055-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe the TLS defaults of Hubble Relay
  source_readings:
  - sections/section-010/module-01/course-04-relay-security-and-tls.md
  prompt: With the default Helm settings, which Relay connection uses mutual TLS?
  options:
  - id: a
    text: From Relay to the Hubble server of each node on port 4244.
    explanation: Correct. Hubble server TLS is on by default.
  - id: b
    text: From the hubble tool to Relay on port 4245.
    explanation: TLS for the Relay server side is off by default.
  - id: c
    text: From the browser to the Hubble UI.
    explanation: The UI is reached by port-forward or ingress; it is not a Hubble
      TLS setting.
  - id: d
    text: None of them.
    explanation: The connection to the node servers uses TLS by default.
  correct_option: a
  explanation: The Relay-to-server connection uses mTLS by default; the client-to-Relay
    side needs hubble.relay.tls.server.enabled.
- id: ats055-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Configure flow export filters
  source_readings:
  - sections/section-010/module-03/course-03-filters-and-field-masks.md
  prompt: An allow filter and a deny filter both match a flow. What does the exporter
    do?
  options:
  - id: a
    text: It does not write the flow, because the deny filter wins.
    explanation: Correct.
  - id: b
    text: It writes the flow, because the allow filter wins.
    explanation: A deny filter always wins.
  - id: c
    text: It writes the flow twice.
    explanation: A flow is written at most once.
  - id: d
    text: It stops the export.
    explanation: A conflict between filters does not stop the exporter.
  correct_option: a
  explanation: A deny filter wins over an allow filter, so a flow that matches both
    is not written.
- id: ats055-final-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish layer 4 flows from layer 7 flows
  source_readings:
  - sections/section-020/module-01/course-01-how-layer-7-visibility-works.md
  prompt: Which component produces the HTTP request flows in Hubble?
  options:
  - id: a
    text: The eBPF programs in the kernel.
    explanation: They see addresses and ports only.
  - id: b
    text: The Envoy proxy inside the Cilium agent.
    explanation: Correct. The proxy parses the application protocol and reports each
      request.
  - id: c
    text: Hubble Relay.
    explanation: Relay only merges flows.
  - id: d
    text: The CoreDNS pods.
    explanation: They answer DNS and do not read HTTP.
  correct_option: b
  explanation: The proxy parses the application protocol and reports each request.
- id: ats055-final-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Write a policy with an HTTP method and path rule
  source_readings:
  - sections/section-020/module-01/course-02-write-http-rules-and-read-http-flows.md
  prompt: Where does an HTTP rule go in a `CiliumNetworkPolicy`?
  options:
  - id: a
    text: Under `endpointSelector`.
    explanation: The selector only chooses pods.
  - id: b
    text: In the `metadata` section.
    explanation: Metadata holds names and labels.
  - id: c
    text: Under `toPorts`, in a `rules` block with the key `http`.
    explanation: Correct. The rule belongs to the port.
  - id: d
    text: In the `cilium-config` ConfigMap.
    explanation: The ConfigMap is for agent settings.
  correct_option: c
  explanation: The rule belongs to the port.
- id: ats055-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Combine HTTP rule fields
  source_readings:
  - sections/section-020/module-01/course-03-http-rule-matching-method-path-and-headers.md
  prompt: An HTTP rule entry has method GET and path /get. Which request matches?
  options:
  - id: a
    text: GET /get
    explanation: Correct. Both fields match.
  - id: b
    text: POST /get
    explanation: The method does not match.
  - id: c
    text: GET /get/1
    explanation: The path expression must match the whole path.
  - id: d
    text: GET /headers
    explanation: The path does not match.
  correct_option: a
  explanation: Fields in one entry combine with AND, and the path expression is matched
    against the whole path.
- id: ats055-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Find refused requests in Hubble
  source_readings:
  - sections/section-020/module-01/course-04-verify-http-visibility-and-verdicts.md
  prompt: Which command shows only HTTP requests that the proxy refused with a 403?
  options:
  - id: a
    text: hubble observe --protocol http --http-status 403
    explanation: Correct.
  - id: b
    text: hubble observe --verdict FORWARDED
    explanation: This shows forwarded flows.
  - id: c
    text: hubble status
    explanation: This shows the health of Hubble.
  - id: d
    text: hubble list nodes
    explanation: This lists the nodes.
  correct_option: a
  explanation: The option --http-status filters on the status code of the HTTP response
    flow.
- id: ats055-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read layer 7 metrics
  source_readings:
  - sections/section-020/module-03/course-03-http-and-dns-metrics.md
  prompt: Which metric counts HTTP requests that the proxy saw?
  options:
  - id: a
    text: hubble_http_requests_total
    explanation: Correct. It comes from the httpV2 group.
  - id: b
    text: hubble_drop_total
    explanation: This counts dropped packets.
  - id: c
    text: hubble_tcp_flags_total
    explanation: This counts TCP flags.
  - id: d
    text: hubble_icmp_total
    explanation: This counts ICMP messages.
  correct_option: a
  explanation: The httpV2 group exposes hubble_http_requests_total and a duration
    histogram.
- id: ats055-final-q11
  type: single_choice
  difficulty: beginner
  learning_objective: Run hubble inside the agent pod and through Relay
  source_readings:
  - sections/section-030/module-01/course-01-connect-the-hubble-cli-and-observe-flows.md
  prompt: Which command reaches Relay from your own machine?
  options:
  - id: a
    text: "`kubectl exec ds/cilium -- hubble status`"
    explanation: That uses the local socket of one agent.
  - id: b
    text: "`kubectl -n kube-system port-forward service/hubble-relay 4245:80`, then
      run `hubble` against localhost:4245."
    explanation: Correct. Relay listens on 4245 behind a Service on port 80.
  - id: c
    text: "`kubectl port-forward service/hubble-ui 12000:80`"
    explanation: That reaches the UI.
  - id: d
    text: "`hubble observe --server relay`"
    explanation: The server value must be an address.
  correct_option: b
  explanation: Relay listens on 4245 behind a Service on port 80.
- id: ats055-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Change a policy to allow one workload
  source_readings:
  - sections/section-030/module-01/course-02-filter-flows-to-find-a-dropped-client.md
  prompt: A client in `outpost` must reach the `probe`. What must its `fromEndpoints`
    selector contain?
  options:
  - id: a
    text: Only the pod label.
    explanation: That matches pods in `starfleet`.
  - id: b
    text: Only the namespace label.
    explanation: That would allow every pod in `outpost`.
  - id: c
    text: 'The pod label and the namespace label `io.kubernetes.pod.namespace: outpost`.'
    explanation: Correct. Without the namespace label, the selector matches the namespace
      of the policy.
  - id: d
    text: The pod IP address.
    explanation: Selectors use labels and identities.
  correct_option: c
  explanation: Without the namespace label, the selector matches the namespace of
    the policy.
- id: ats055-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Process flows with jq
  source_readings:
  - sections/section-030/module-01/course-03-output-formats-and-jq.md
  prompt: Which output option gives one JSON object per flow for jq?
  options:
  - id: a
    text: "-o json"
    explanation: Correct.
  - id: b
    text: "-o compact"
    explanation: Compact is a short text line.
  - id: c
    text: "-o dict"
    explanation: Dict prints key and value lines.
  - id: d
    text: "-o table"
    explanation: Table prints columns.
  correct_option: a
  explanation: The json format prints one object per line with the flow under the
    key flow.
- id: ats055-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Negate a filter
  source_readings:
  - sections/section-030/module-01/course-04-advanced-flow-filters.md
  prompt: Which option hides flows that match the filters after it?
  options:
  - id: a
    text: "--not"
    explanation: Correct.
  - id: b
    text: "--last"
    explanation: This limits the number of flows.
  - id: c
    text: "--follow"
    explanation: This keeps streaming new flows.
  - id: d
    text: "--all"
    explanation: This prints every flow in the buffer.
  correct_option: a
  explanation: The option --not negates the filters that follow it.
- id: ats055-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Apply the troubleshooting method
  source_readings:
  - sections/section-030/module-03/course-01-start-with-the-verdict.md
  prompt: What is the first step when a pod cannot reach a service?
  options:
  - id: a
    text: Check for dropped flows of the pod and read the drop reason.
    explanation: Correct.
  - id: b
    text: Restart the Cilium agents.
    explanation: A restart hides evidence and may not help.
  - id: c
    text: Delete the network policy.
    explanation: This opens access without a reason.
  - id: d
    text: Increase the flow buffer.
    explanation: Do this only if flows are missing.
  correct_option: a
  explanation: The verdict tells whether the network dropped the traffic, and the
    drop reason points to the next check.
