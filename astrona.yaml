      url: https://docs.cilium.io/en/stable/observability/hubble/
  - type: reading
    title: Summary
    path: sections/section-010/module-01/course-03-summary.md
  - type: reading
    title: Hubble Metrics And Flow Buffer Sizing
    path: sections/section-010/module-02/course.md
