    task_kind: troubleshooting
    tags:
    - hubble
    - flow
    - verdict
    - drop
    - cilium-network-policy
    learning_goals:
    - Find a forwarded and a dropped flow with hubble observe
    - Report the source, destination, port and drop reason of a dropped flow
    - Keep the policy unchanged
    resources:
