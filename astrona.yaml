# Course manifest for ATS055 - Network Observability (Cilium Certified Associate).
# Every path is relative to this file. Playgrounds are not listed: the landing page marker shows them.
training:
  id: ATS055
  title: 'CCA: Network Observability'
  description: 'Training material covering the Cilium Certified Associate (CCA) Network
    Observability domain: what Hubble records and how long it keeps it, layer 7 visibility
    for HTTP and DNS, and using the Hubble command line and the Hubble UI. Each module
    pairs developed reading with an ungraded playground and a graded lab. Each section
    closes with a capstone lab and a knowledge check. All labs are untested drafts.'
  certification:
    name: Cilium Certified Associate
    code: CCA
    provider: CNCF / Linux Foundation
    domain: Network Observability
    weight: 10
    competencies:
    - Understand the Observability Capabilities of Hubble
    - Enabling Layer 7 Protocol Visibility
    - Know How to Use Hubble from the Command Line or the Hubble UI
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: Understand the Observability Capabilities of Hubble
  description: Makes the reader able to say what Hubble records, where flows are stored,
    how to read a flow and its verdict, and how to count events and size the flow
